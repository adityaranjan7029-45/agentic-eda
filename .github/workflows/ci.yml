name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12: what servers and Docker images typically run.
        # 3.14: what we develop on locally.
        python-version: ["3.12", "3.14"]

    # A real Postgres for the API tests (JSONB, migrations, cascades). Throwaway, per job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eda
          POSTGRES_PASSWORD: eda
          POSTGRES_DB: eda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv -p ${{ matrix.python-version }} .venv

      - name: Install dependencies
        run: uv pip install -p .venv/bin/python -r requirements.txt -e "engine[dev]" -e "api[dev]"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://eda:eda@localhost:5432/eda_test
        run: .venv/bin/python -m pytest -q -rs

