name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12: what servers and Docker images typically run.
        # 3.14: what we develop on locally.
        python-version: ["3.12", "3.14"]

    # Real Postgres and Redis for the API tests. Throwaway, per job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eda
          POSTGRES_PASSWORD: eda
          POSTGRES_DB: eda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv -p ${{ matrix.python-version }} .venv

      - name: Install dependencies
        run: uv pip install -p .venv/bin/python -r requirements.txt -e "engine[dev]" -e "api[dev]"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://eda:eda@localhost:5432/eda_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: .venv/bin/python -m pytest -q -rs

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-not-used-anywhere-0123456789
          NEXT_TELEMETRY_DISABLED: "1"
  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, web] # build images only after the fast checks pass
    env:
      # throwaway values for this job only; the GitHub login is never used (tests mint the session cookie)
      E2E_AUTH_SECRET: ci-e2e-auth-secret-0123456789abcdef0123456789
      LOADTEST_JWT_SECRET: ci-e2e-api-jwt-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4

      - name: Write throwaway secrets
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          SECRET_KEY=$(openssl rand -hex 32)
          API_JWT_SECRET=$LOADTEST_JWT_SECRET
          EOF
          cat > web/.env.local <<EOF
          AUTH_SECRET=$E2E_AUTH_SECRET
          AUTH_GITHUB_ID=ci-not-used
          AUTH_GITHUB_SECRET=ci-not-used
          API_JWT_SECRET=$LOADTEST_JWT_SECRET
          EOF

      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: e2e
        run: npm test

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Load test (short)
        run: |
          uv venv -p 3.12 .venv-load
          uv pip install -p .venv-load/bin/python -r loadtest/requirements.txt
          .venv-load/bin/locust -f loadtest/locustfile.py --host http://localhost:8000 \
            --headless -u 10 -r 5 -t 45s --only-summary

      - name: Container status and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 300

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images (GHCR)
    # only after every check passed, and only for main: the server deploys these images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agentic-eda-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentic-eda-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/agentic-eda-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
