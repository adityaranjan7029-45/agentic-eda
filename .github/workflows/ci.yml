name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12: what servers and Docker images typically run.
        # 3.14: what we develop on locally.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv -p ${{ matrix.python-version }} .venv

      - name: Install dependencies
        run: uv pip install -p .venv/bin/python -r requirements.txt -e "engine[dev]"

      - name: Run tests
        run: .venv/bin/python -m pytest -q
        